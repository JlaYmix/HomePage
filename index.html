<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/middle.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="container">

        <div class="container-block">

            <div class="logo">
                <img src="./imgs/icons/Logo.svg" class="logo-style" alt="logo">
            </div>

            <div class="right-block">
                <div class="search-wrapper">
                    <input class='w3-border' type="text" placeholder="Search">
                    <img src="./imgs/icons/ico_search.svg" class="ico-style" alt="search">
                </div>

            <ul class="list">
                <li>Home</li>
                <li>Company Profile</li>
                <li>Products</li>
                <li>Services</li>
                <li>R & D</li>
                <li>Contact</li>
            </ul>
        </div>
    </header>

    <main class="container-main">
        <div class="container-center">
            <p style="font-family: RobotoSlab-Bold; font-size: 48px; color: var(--color-p); margin-bottom: 50px;">
                Agridera Seeds and Agriculture Ltd
            </p>
            <button style="font-family: RobotoSlab-Medium; font-size: 16px; color: white; background-color: var(--color-button); border: none; padding: 16px 31px 16px 31px;">
                READ MORE
            </button>
        </div>
    </main>

    <footer class="container-footer-header">
        <div class="footer-wrapper">
            <section>
            <img src="./imgs/logos/Vector.svg" alt="Wheat">
            <h1>Wheat</h1>
        </section>

        <section>
            <img src="./imgs/logos/Group 3.svg" alt="Watermelon">
            <h1>Confection Watermelon</h1>
        </section>

        <section>
            <img src="./imgs/logos/Vector (3).svg" alt="Clover">
            <h1>Clover</h1>
        </section>

        <section>
            <img src="./imgs/logos/Vector (1).svg" alt="Confection Sunflower">
            <h1>Confection Sunflower</h1>
        </section>

        <section>
            <img src="./imgs/logos/Vector (2).svg" alt="Tomato">
            <h1>Tomato</h1>
        </section>

        <section>
            <img src="./imgs/logos/Component 1.svg" alt="Eggplant">
            <h1>Eggplant P/O</h1>
        </section>

        <section>
            <img src="./imgs/logos/Group 5.svg" alt="Sunflower">
            <h1>Ornamental Sunflower</h1>
        </section>
        </div>
    </footer>

</body>
</html>
