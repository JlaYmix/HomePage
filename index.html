<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/middle.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="container">
    <div class="container-block">

        <div class="logo">
            <img src="./imgs/icons/Logo.svg" class="logo-style" alt="logo">
        </div>

        <div class="right-block">
            <div class="search-wrapper">
                <input class="w3-border" type="text" placeholder="Search">
                <img src="./imgs/icons/ico_search.svg" class="ico-style" alt="search">
            </div>

            <ul class="list">
                <li>Home</li>
                <li>Company Profile</li>
                <li>Products</li>
                <li>Services</li>
                <li>R & D</li>
                <li>Contact</li>
            </ul>
        </div>

    </div>
</header>

<main>
    <!-- HERO -->
    <section class="hero">
        <div class="container-center">
            <p class="hero-title">
                Agridera Seeds and Agriculture Ltd
            </p>

            <button class="hero-btn">
                READ MORE
            </button>
        </div>
    </section>

    <!-- Home Page -->
    <section>
        <div class="container-footer-header">
            <div class="footer-wrapper">
                <section>
                    <img src="./imgs/logos/Vector.svg" alt="Wheat">
                    <h1>Wheat</h1>
                </section>

                <section>
                    <img src="./imgs/logos/Group 3.svg" alt="Watermelon">
                    <h1>Confection Watermelon</h1>
                </section>

                <section>
                    <img src="./imgs/logos/Vector (3).svg" alt="Clover">
                    <h1>Clover</h1>
                </section>

                <section>
                    <img src="./imgs/logos/Vector (1).svg" alt="Confection Sunflower">
                    <h1>Confection Sunflower</h1>
                </section>

                <section>
                    <img src="./imgs/logos/Vector (2).svg" alt="Tomato">
                    <h1>Tomato</h1>
                </section>

                <section>
                    <img src="./imgs/logos/Component 1.svg" alt="Eggplant">
                    <h1>Eggplant P/O</h1>
                </section>

                <section>
                    <img src="./imgs/logos/Group 5.svg" alt="Sunflower">
                    <h1>Ornamental Sunflower</h1>
                </section>
            </div>
        </div>
    </section>

    <!-- Vision Mission -->
    <section class="vision-mission">

    </section>
</main>

<footer>

</footer>

</body>
</html>
